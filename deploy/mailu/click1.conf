# Mailu includes override files inside its main HTTP/HTTPS server block.
# Route only the Click+1 hostname through an internal URI prefix, then proxy
# that prefix to the API container on the shared mailu_default network.
if ($host = click1.nfthubcity.xyz) {
    rewrite ^/(?!\.well-known/acme-challenge/)(.*)$ /__click1__/$1 last;
}

location ^~ /__click1__/ {
    rewrite ^/__click1__/(.*)$ /$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://click1-api:3000;
}
